<script>
    var video = document.getElementById("myvideo");

    function playPause() {
        if (video.paused) {
            video.play();
        } else {
            video.pause();
        }
    }

    function seek(seconds) {
        video.currentTime += seconds;
    }

    function setVolume(volume) {
        video.volume = volume;
    }

    function muteUnmute() {
        if (video.muted) {
            video.muted = false;
        } else {
            video.muted = true;
        }
    }
</script>
